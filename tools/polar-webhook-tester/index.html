<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Webhook Signature Tester (Standard Webhooks / Polar)</title>
<style>body{font-family:system-ui;max-width:720px;margin:40px auto;padding:0 16px}textarea,input{width:100%;font-family:monospace;margin:4px 0 12px}code{word-break:break-all}</style></head>
<body><h1>Webhook signature tester</h1><p>Runs locally in your browser. Nothing is uploaded.</p>
<label>Secret (the <code>whsec_…</code> value from the Polar dashboard, as-is)</label><input id="sec">
<label>webhook-id</label><input id="wid" value="msg_test">
<label>webhook-timestamp (unix seconds)</label><input id="ts">
<label>Raw body</label><textarea id="body" rows="6">{"type":"order.paid","data":{"id":"ord_123"}}</textarea>
<label>Received webhook-signature (optional)</label><input id="got" placeholder="v1,...">
<button id="go">Compute</button><p>Expected: <code id="exp"></code></p><p id="res"></p>
<p><a href="#starter-kit">Skip the wiring → Polar + Next.js Starter Kit</a></p>
<script>
const $=id=>document.getElementById(id);$("ts").value=Math.floor(Date.now()/1000);
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sign(keyBytes,msg){const k=await crypto.subtle.importKey("raw",keyBytes,{name:"HMAC",hash:"SHA-256"},false,["sign"]);return "v1,"+b64(await crypto.subtle.sign("HMAC",k,new TextEncoder().encode(msg)));}
// Polar (docs, Oct 2026): secrets created on/after 2026-09-08 00:00 UTC use Standard Webhooks
// (key = base64-decoded part after whsec_); older secrets use Polar HMAC (key = UTF-8 bytes of the full whsec_ string).
$("go").onclick=async()=>{
 const s=$("sec").value.trim(), msg=`${$("wid").value}.${$("ts").value}.${$("body").value}`;
 let std=null; try{std=await sign(unb64(s.replace(/^whsec_/,"")),msg);}catch(e){}
 const legacy=await sign(new TextEncoder().encode(s),msg);
 $("exp").innerHTML=`Standard Webhooks (new secrets): ${std??"n/a: secret isn't valid base64"}<br>Polar HMAC (pre-2026-09-08 secrets): ${legacy}`;
 const got=$("got").value.trim().split(" ");
 if(got[0]){const m=got.includes(std)?"✅ Matches Standard Webhooks scheme":got.includes(legacy)?"✅ Matches legacy Polar HMAC scheme":"❌ No match: check the secret, exact raw body (no re-serialization), id, and timestamp";$("res").textContent=m;}
};
</script></body></html>
